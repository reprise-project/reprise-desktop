# Lets the Reprise compositor register as the session's geoclue agent: it
# asks before a sandboxed program gets the location and shows the location
# indicator. geoclue replaces the whole whitelist with the last file that
# sets it, so the default agents are listed again before reprise.
[agent]
whitelist=geoclue-demo-agent;gnome-shell;io.elementary.desktop.agent-geoclue2;sm.puri.Phosh;lipstick;reprise
