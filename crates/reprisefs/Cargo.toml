[package]
name = "reprisefs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The file-system side of the shell: .desktop entries and MIME, naming rules, copy/move/shortcut, freedesktop trash, folder listings, the freedesktop thumbnail cache. No display dependency. UDisks2 over zbus for drives."

[lints]
workspace = true

[dependencies]
reprisexdg = { path = "../reprisexdg" }
async-io = "2"
futures-util.workspace = true
# The launcher trust marker is an HMAC-SHA256 of the inode.
hmac = "0.13"
# Screenshots' and pasted pictures' PNG and JPEG files.
image.workspace = true
inotify.workspace = true
libc.workspace = true
log.workspace = true
# The thumbnail cache: entry names are the MD5 of a file URI, and
# entries are PNGs with text chunks. Properties' Checksums tab too.
md5 = "0.8"
png.workspace = true
reprisebus = { path = "../reprisebus" }
# `tr!`: Fluent strings, as in the dates this crate writes.
reprisekit = { path = "../reprisekit" }
# Features only: the zbus and reprisebus units every program that links reprisekit builds.
repriseapp-pins = { path = "../repriseapp-pins" }
# The JPEG XL encoder process and its protocol.
reprise-encode = { path = "../apps/encode" }
repriseconfine = { path = "../repriseconfine" }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
# Clean Up reads `coredumpctl list --json`.
serde_json.workspace = true
# The trust marker, and Properties' Checksums tab.
sha2 = "0.11"
# `[recycle_bin]` in config.toml, which every host's Delete reads.
toml_edit.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
