[package]
name = "reprise-explorer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Explorer: browses the files and folders on your computer"

[lints]
workspace = true

[[bin]]
name = "reprise-explorer"
path = "src/bin/reprise-explorer.rs"
test = false

[dependencies]
repriseapp = { path = "../../repriseapp" }
reprisekit = { path = "../../reprisekit" }
reprisefs = { path = "../../reprisefs" }
reprisebus = { path = "../../reprisebus" }
repriseconf = { path = "../../repriseconf" }
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
inotify.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
