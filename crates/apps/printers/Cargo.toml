[package]
name = "reprise-printers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Printers: the CUPS printers, their queues and settings, the Add Printer wizard and the printing tray icon"

[lints]
workspace = true

[[bin]]
name = "reprise-printers"
path = "src/main.rs"

[dependencies]
repriseapp = { path = "../../repriseapp" }
reprisekit = { path = "../../reprisekit" }
reprisetray = { path = "../../reprisetray" }
reprisefs = { path = "../../reprisefs" }
libc.workspace = true
# cups-pk-helper on the system bus, for accounts outside CUPS's admin group.
zbus.workspace = true
serde.workspace = true
log.workspace = true
env_logger.workspace = true
