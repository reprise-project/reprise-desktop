[package]
name = "reprise-updates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Software Updates: system updates through PackageKit, Flatpak updates and firmware through fwupd, and the tray icon that says when there are some"

[lints]
workspace = true

[[bin]]
name = "reprise-updates"
path = "src/main.rs"

[dependencies]
repriseapp = { path = "../../repriseapp" }
reprisekit = { path = "../../reprisekit" }
reprisetray = { path = "../../reprisetray" }
reprisebus = { path = "../../reprisebus" }
repriseconf = { path = "../../repriseconf" }
zbus.workspace = true
futures-util.workspace = true
toml.workspace = true
# The settle pause after a burst of change signals; zbus already pulls
# it in.
async-io = "2"
log.workspace = true
env_logger.workspace = true
