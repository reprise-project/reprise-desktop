[package]
name = "reprise-updates"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Software Updates: system updates through PackageKit, Flatpak updates and firmware through fwupd, the tray icon that says when there are some, and the sheet that installs package files and uninstalls programs"

[lints]
workspace = true

[[bin]]
name = "reprise-updates"
path = "src/bin/reprise-updates.rs"
test = false

[dependencies]
repriseapp = { path = "../../repriseapp" }
reprisekit = { path = "../../reprisekit" }
reprisetray = { path = "../../reprisetray" }
reprisebus = { path = "../../reprisebus" }
reprisefs = { path = "../../reprisefs" }
repriseconf = { path = "../../repriseconf" }
zbus.workspace = true
futures-util.workspace = true
# The settle pause after a burst of change signals; zbus already pulls
# it in.
async-io = "2"
inotify.workspace = true
libc.workspace = true
log.workspace = true
