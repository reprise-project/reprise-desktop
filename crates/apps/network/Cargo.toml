[package]
name = "reprise-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Network Connections: the Reprise network icon and its windows"

[lints]
workspace = true

[[bin]]
name = "reprise-network"
path = "src/main.rs"

[dependencies]
repriseapp = { path = "../../repriseapp" }
reprisefs = { path = "../../reprisefs" }
reprisekit = { path = "../../reprisekit" }
reprisetray = { path = "../../reprisetray" }
reprisebus = { path = "../../reprisebus" }
async-channel.workspace = true
zbus.workspace = true
zeroize.workspace = true
futures-util.workspace = true
libc.workspace = true
log.workspace = true
getrandom = "0.4"

[dev-dependencies]
zbus = { workspace = true, features = ["p2p"] }
