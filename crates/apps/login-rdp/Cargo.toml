[package]
name = "reprise-login-rdp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The Remote Desktop front of reprise-login: an unprivileged, sandboxed service that holds the machine's RDP port and hands each authenticated connection to the user's session"

[lints]
workspace = true

[[bin]]
name = "reprise-login-rdp"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
ironrdp-acceptor.workspace = true
ironrdp-connector.workspace = true
ironrdp-core.workspace = true
ironrdp-pdu.workspace = true
ironrdp-tokio.workspace = true
libc.workspace = true
log.workspace = true
reprisebus = { path = "../../reprisebus" }
repriselogin = { path = "../../repriselogin" }
reprisetls = { path = "../../reprisetls" }
tokio = { workspace = true, features = ["rt", "net", "time", "macros", "io-util", "sync"] }
tokio-rustls.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
