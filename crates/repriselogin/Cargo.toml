[package]
name = "repriselogin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The wire protocol of reprise-login with its greeter, user sessions, its RDP front and reprise-rdp: socket paths, length-prefixed JSON frames with fd passing, the messages, the machine settings and the login throttle"

