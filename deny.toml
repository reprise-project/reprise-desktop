# `cargo deny check`: advisories, licences, duplicate crates and sources.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Vulnerabilities always fail; an unmaintained crate fails only as a direct dependency.
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
]

unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The older copy of each crate the lock holds twice today, so only a new duplicate warns.
skip = [
    { crate = "rustix@0.38.44", reason = "drm 0.14 via smithay" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 via drm 0.14" },
    { crate = "linux-raw-sys@0.9.4", reason = "drm-sys 0.8 via smithay" },
    { crate = "x11rb@0.13.2", reason = "smithay's xwayland; ours is 0.14" },
    { crate = "x11rb-protocol@0.13.2", reason = "x11rb 0.13 via smithay" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18; flate2 has 0.9" },
    { crate = "nom@7.1.3", reason = "cexpr via bindgen, build only" },
    { crate = "shlex@1.3.0", reason = "bindgen, build only; cc has 2.0" },
    { crate = "syn@2.0.119", reason = "proc macros not yet on syn 3" },
    { crate = "phf@0.13.1", reason = "emojis 0.9; accesskit has 0.14" },
    { crate = "phf_shared@0.13.1", reason = "phf 0.13 via emojis" },
    { crate = "roxmltree@0.20.0", reason = "fontconfig-parser 0.5; usvg has 0.21" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/reprise-project/smithay"]
