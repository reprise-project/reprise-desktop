version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # The Smithay fork is bumped by hand with its patches.
    ignore:
      - dependency-name: smithay
      - dependency-name: smithay-drm-extras
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The composite action pins its own actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
