name: Bug report
description: Something in Reprise is broken or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: about
    attributes:
      label: About Reprise
      description: Open About Reprise, click Copy and paste the text here. It includes your host name and user name; edit them out if you like.
      render: text
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface in use
      description: The one you were running when it happened, even if the bug isn't about how things look.
      options:
        - Classic
        - Blue
        - Glass
    validations:
      required: true
  - type: input
    id: scheme
    attributes:
      label: Colour scheme
      description: The scheme picked on the Appearance page of Reprise Settings, or `color_scheme` in the config. Leave empty for the default.
      placeholder: Reprise Standard
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Errors in the session log
      description: |
        If Reprise crashed or misbehaved, paste the output of `journalctl --user -b -t reprise -p err` (`-b -1` in place of `-b` after a reboot). If it died with SIGSEGV or another signal, also paste `coredumpctl info reprise`. With the `reprise-debug` package installed, both show file and line numbers.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image or a recording in here, if the bug shows on screen.
