name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  # .github/ci-image pins the image and its packages.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/reprise-project/reprise-ci:2026-10-25-f7b0d8395c9e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Incremental state buys nothing on a fresh runner and doubles the cache.
    env:
      CARGO_INCREMENTAL: 0
      # Where rust-cache looks for the registry; the builds run as builder.
      CARGO_HOME: /home/builder/.cargo
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/ci-image/tag.sh --check
      - uses: ./.github/actions/build
        with:
          checks: lint
  # A pull request tests the crates its changes can reach; main tests everything.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/reprise-project/reprise-ci:2026-10-25-f7b0d8395c9e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_HOME: /home/builder/.cargo
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # A font-gated test fails instead of skipping; see CONTRIBUTING.md.
      REPRISE_TEST_STRICT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^ is the base of a pull request's merge commit.
          fetch-depth: 2
      - uses: ./.github/actions/build
        with:
          checks: test
          affected: ${{ github.event_name == 'pull_request' }}
  # The same on today's image and repos: shows what the next pin bump will meet, without
  # blocking a merge.
  canary:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_HOME: /home/builder/.cargo
      REPRISE_TEST_STRICT: 1
    steps:
      # The first checkout downloads the tree for .github/pacman.sh; the second clones once git
      # is in, as the licence test lists tracked files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/pacman.sh git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          setup: "true"
