name: supply
on:
  push:
    branches: [main]
  pull_request:
  # Advisories land without a commit of ours.
  schedule:
    - cron: "17 5 * * 1"
concurrency:
  group: supply-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deny:
    runs-on: ubuntu-latest
    container: archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    steps:
      - name: Install cargo-deny
        run: pacman -Syu --noconfirm --needed rust cargo-deny
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo deny --locked check
