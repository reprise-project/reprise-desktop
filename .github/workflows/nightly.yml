name: nightly
on:
  push:
    branches: [main]
  workflow_dispatch:
# Only publish gets a write token; build runs every dependency's build script.
permissions:
  contents: read
jobs:
  build:
    # A newer commit on the same ref cancels the build in progress.
    concurrency:
      group: nightly-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container: archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    env:
      CARGO_INCREMENTAL: 0
    steps:
      # Downloads the tree for .github/pacman.sh; the second checkout clones once git is in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: >-
          bash .github/pacman.sh base-devel github-cli rust clang pkgconf git seatd systemd systemd-libs libinput libdrm mesa libglvnd libdisplay-info libxkbcommon xorg-xwayland freetype2 fontconfig pam libxcrypt dbus pipewire zlib ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pkgver counts the commits.
          fetch-depth: 0
          persist-credentials: false
      # makepkg refuses root; -s finds the depends installed and needs sudo only for one missing.
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            /home/builder/makepkg/build/reprise/src/target
          key: nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: nightly-
      # checkout and caches come back owned by root.
      - run: chown -R builder "$GITHUB_WORKSPACE" /home/builder
      - name: Build package
        run: >-
          runuser -u builder -- env HOME=/home/builder REPRISE_MAKEPKG_DIR=/home/builder/makepkg
          packaging/arch/local/build.sh -s --noconfirm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            /home/builder/makepkg/pkg/reprise-[0-9]*.pkg.tar.zst
            /home/builder/makepkg/pkg/reprise-debug-[0-9]*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1
  deb:
    concurrency:
      group: nightly-deb-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container: ubuntu:26.04@sha256:065aa8626841f16057b78b027b464cd59c4fac36c204c72dcbf48d66f5fa8a96
    env:
      CARGO_INCREMENTAL: 0
      DEBIAN_FRONTEND: noninteractive
      REPRISE_DEB_DIR: /deb
    steps:
      # Downloads the tree for build-depends; the second checkout clones once git is in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          apt-get update -qq
          xargs apt-get install -y -qq --no-install-recommends < packaging/deb/build-depends
          rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pkgver counts the commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /deb/target
          key: nightly-deb-${{ hashFiles('Cargo.lock') }}
          restore-keys: nightly-deb-
      # The checkout belongs to the runner's user, not the container's root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build package
        run: packaging/deb/build.sh /deb/reprise-nightly-ubuntu26.04-amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: /deb/reprise-nightly-ubuntu26.04-amd64.deb
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [build, deb]
    # Each package publishes when its own build passed, so a broken .deb never holds the Arch
    # package back, or the other way round. A dispatch from another branch never moves Nightly.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (needs.build.result == 'success' || needs.deb.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer commit waits for a publish in progress; cancelling it mid-upload would leave the
    # tag on one commit and the asset from another.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: pkg
      - if: needs.deb.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: .
      # The tag and the notes follow the Arch package, and each asset keeps one name, so the
      # download URLs are stable.
      - name: Publish the Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=reprise-nightly-x86_64.pkg.tar.zst
          debug_asset=reprise-debug-nightly-x86_64.pkg.tar.zst
          deb_asset=reprise-nightly-ubuntu26.04-amd64.deb
          url="https://github.com/$GH_REPO/releases/download/nightly"
          notes="Arch Linux:

              curl -LO $url/$asset
              sudo pacman -U ./$asset

          Ubuntu 26.04:

              curl -LO $url/$deb_asset
              sudo apt install ./$deb_asset"
          assets=()
          if [ -d pkg ]; then
            pkg=$(ls pkg/reprise-[0-9]*.pkg.tar.zst)
            cp "$pkg" "$asset"
            cp "$(ls pkg/reprise-debug-[0-9]*.pkg.tar.zst)" "$debug_asset"
            assets+=("$asset" "$debug_asset")
            notes="$(basename "$pkg"), built from $GITHUB_SHA.

          $notes"
            git tag -f nightly "$GITHUB_SHA"
            git push -f origin refs/tags/nightly
          fi
          if [ -f "$deb_asset" ]; then assets+=("$deb_asset"); fi
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
            if [ -d pkg ]; then gh release edit nightly --notes "$notes"; fi
          else
            gh release create nightly "${assets[@]}" --title Nightly --prerelease --notes "$notes"
          fi
