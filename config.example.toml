# Reprise configuration. Every key is optional.

terminal = "reprise-terminal"   # a command line, arguments included (quote a program path with spaces); programs that need a terminal run as <terminal> -e <program>, so the arguments hold no -e; Default Programs sets it
# script_open = "run"   # what opening a script from the desktop, Explorer or a search does: "run" runs it with no window, "terminal" runs it in `terminal`; its menu has Run and Run in terminal either way; Default Programs sets it
# confirm_scripts = true   # opening a script the first time asks Run / Open in Notepad / Cancel, a binary or a file its program runs (.exe, .msi, .jar, .appimage) Run / Cancel; Run is remembered for that file until it changes; a script's Run row never asks; Default Programs sets it
# script_terminal = "stay"   # a script run in `terminal`: "stay" waits for Enter after it ends, "close" closes the window at once unless the script fails; Default Programs sets it
# task_manager = "gnome-system-monitor"   # what the taskbar menu's Task Manager row and Ctrl+Shift+Escape start; default: Reprise's Task Manager (reprise-taskmgr)
startmenu_banner = "Reprise Desktop"   # text of the vertical band on the Start menu's left edge
# startmenu_style = "glass"   # the Start menu: "classic" (the band and the [[startmenu]] entries), "blue" (programs and places in two columns under your picture) or "glass" (programs, search and places in two columns); default: the interface's own
desktop_icons = true          # icons for the files in ~/Desktop (XDG_DESKTOP_DIR); false hides them and the desktop takes no files, the system icons stay
# desktop_extensions = "hide"  # file name extensions in desktop labels: "hide" (every registered type's), "hide_launchers" (only .desktop) or "show"; report.pdf.sh always shows in full
start_icon = false            # the Start button's logo: the icon theme's start-here (true) or the Reprise mark (false)
adaptive_sync = false         # variable refresh rate on every output that supports it; an [[outputs]] entry overrides it, and the Display page of Reprise Settings sets that one
system_icons = ["documents", "computer", "home", "recycle-bin"]   # the desktop's system icons, in order; home is your home folder
# desktop_widgets = ["clock", "calendar", "meter"] # widgets standing on the desktop, each once; default none; the desktop menu's Widgets and Settings > Background set it; places and options are kept in $XDG_STATE_HOME/reprise/widgets.toml

[colors]                     # "#RRGGBB" or "r g b"; a key set here overrides
                              # the interface's own colour, so every line
                              # below is commented out: each already equals
                              # Classic's default scheme, Reprise Standard
# active_title = "10 36 106"
# gradient_active_title = "166 202 240"
# inactive_title = "128 128 128"
# gradient_inactive_title = "192 192 192"
# background = "#3A6EA5"      # the desktop colour, behind [wallpaper]'s picture; the Background page sets it
# button_face = "212 208 200"
# desktop_text = "255 255 255"
# info_bk = "255 255 225"      # tooltips and balloons
# info_text = "0 0 0"
# hot_light = "0 0 128"       # links

[metrics]                    # pixels, except where noted; a key set here
                              # overrides the interface's own metric, so
                              # every line below is commented out: each
                              # already equals Reprise Classic's built-in
                              # default
# frame_width = 4
# caption_height = 18
# taskbar_height = 28
# caption_button_gap = 0       # extra space between minimize and maximize; Blue's own default is 2
# cascade_origin = 32
# cascade_step = 24
# menu_shadow = 4               # drop shadow under menus, 0 for none
# double_click_ms = 500         # milliseconds, not scaled on HiDPI outputs
# menu_hover_ms = 400           # milliseconds a hovered row waits before its submenu opens or closes
# menu_fade_ms = 150            # milliseconds a menu takes to open ([effects] menu_animation), 0 for at once

[fonts]
family = ["Tahoma", "DejaVu Sans"]
size_px = 11
antialias = false             # Reprise's own text; false: hinted monochrome; true: hinted grayscale
#                             # programs' text follows [toolkits] font_smoothing
# shell_dlg = ""              # second dialog font, a family or a .ttf path, for End Program,
#                             # Power Options, a folder's Properties and the other dialogs
#                             # docs/assets.md lists; unset, they use family

[icons]
theme = "hicolor"            # freedesktop icon theme for menus, taskbar, captions and the programs Reprise starts

[cursor]                     # the pointer; programs started from Reprise get it too
# theme = ""                 # an XCursor theme from ~/.icons or /usr/share/icons; empty
#                            # keeps XCURSOR_THEME, or the "default" theme without it
# size = 0                   # pixels, up to 256; 0 keeps XCURSOR_SIZE, or 24 without it

[toolkits]                   # how GTK and Qt programs look
# gtk_theme = "auto"         # a GTK theme's name, handed to GTK3 and GTK4 through the
#                            # portal; "auto" is Adwaita, Adwaita-dark under a dark look;
#                            # "reprise" is Adwaita (GTK3) and GTK4's own theme in the
#                            # look's colours, with Classic's 3D edges under Classic,
#                            # written to ~/.local/share/themes/Reprise
#                            # and Reprise-alt and rewritten when the look changes;
#                            # libadwaita programs ignore it, see gtk4_colors
# qt_platform_theme = "auto" # QT_QPA_PLATFORMTHEME for programs Reprise starts
#                            # (xdgdesktopportal, qt6ct, qt5ct, kde, gtk3); "auto" is
#                            # xdgdesktopportal under a dark look, else the session's own;
#                            # "reprise" is qt6ct or qt5ct with Fusion in the look's
#                            # colours (needs one of them; Reprise writes qt6ct.conf and
#                            # qt5ct.conf only when they are absent or its own)
# gtk4_colors = false        # true: GTK4 and libadwaita programs take the look's colours
#                            # from ~/.config/gtk-4.0/gtk.css, which Reprise writes when it
#                            # is absent or its own and rewrites when the look changes;
#                            # programs already running keep theirs until they restart;
#                            # false removes the file if Reprise wrote it
# font_smoothing = "grayscale" # grayscale | subpixel | none: how GTK and the browsers
#                            # smooth their text; none is fully hinted monochrome

[appearance]
interface = "classic"        # classic | blue | glass; an unknown value falls back to classic
# color_scheme = "Brick"     # Classic: a scheme name (Reprise Settings' Appearance page lists them); Blue: "Blue", "Olive Green", "Silver", "Slate", "Sapphire", "Obsidian", "Ember", "Cobalt", "Carbon" or "Steel"; Glass has none, see [glass] color
#                            # a name from another interface falls back to that interface's default and logs a warning; Glass ignores the key

# [wallpaper]                # the picture under the desktop icons, drawn over [colors] background
# image = "/usr/share/backgrounds/picture.jpg"   # bmp, jpg, png or dib; "" or a file that does not decode shows the colour alone
# image = "reprise:tarn/dusk"   # a built-in drawn picture, see below; unset, classic shows the colour alone, blue tarn/blue, glass flow/glass
#                            # built-ins: caustic, reeded, panes (sky ruby green violet dark), ridges, tarn (dawn day dusk night blue),
#                            # terraces (spring harvest dusk frost blue), fold (teal steel sand night), contour (teal night paper dusk),
#                            # flow (night ink teal ember). caustic, reeded, panes and flow also take glass (tinted from [glass] color; flow is night in dark mode),
#                            # hue-<0..359> and hue-<0..359>-dark. A built-in always fills the screen; position does not apply
# position = "stretch"       # center | tile | stretch
# desktops = ["", "reprise:tarn/dusk"]   # each virtual desktop's own picture, entry 1 for desktop 1; "" shows image (or the slideshow)
# slideshow = "~/Pictures/Wallpapers"   # a folder whose pictures take turns in place of image, each fading into the next
# interval = 30              # minutes each slideshow picture shows, 1 to 1440; the desktop menu's Next desktop background skips ahead
# shuffle = false            # true: the slideshow picks at random instead of by file name (case ignored, numbers by value)
# water = "off"              # off | calm | lively | rain | ink | glow | sparks | neon: calm, lively and rain ripple the wallpaper after the pointer, the icons and the windows (rain adds a drop every second or so); ink, glow, sparks and neon are a fluid stirred by dragging on the desktop, needing OpenGL ES 3 with half-float targets
# water_rate = "refresh"     # "refresh" | 30 to 240: steps a second; refresh steps once a frame at each output's own refresh. The screen draws the water only when it steps, so a lower rate draws fewer frames. Rain alone draws at most 30 frames a second, two or more steps each, until the pointer, a click or a window stirs the water. The ripples settle and travel alike at any rate, but below 60 they travel slower, at rate/60 of their speed

# [glass]                    # Reprise Glass only
# color = "sky"              # sky twilight sea leaf lime sun pumpkin ruby fuchsia blush
#                            # violet lavender taupe chocolate slate frost, or "#RRGGBB"
# intensity = 42             # 0 to 100: how much of the colour shows
# transparency = true        # false: opaque glass, no blur, least GPU work
# blur = 2                   # 1 (lightest, least GPU work) to 5 (strongest)
# streaks = true             # false: no reflection streaks over the glass
# fast_drag = true           # while a window is dragged or sized: a lighter blur,
#                            # a frame behind; the full one again once let go
# blur_frames = true         # glass over another window's frame and glass, a dialog's
#                            # or the taskbar's shows them blurred; false: one blur less
#                            # per such glass
# blur_rate = 30             # at most this many times a second a program drawing
#                            # next to the glass (a video) or desktop water blurs
#                            # into it again; 0: every frame
# mode = "light"             # light | dark | night (dark from sunset to sunrise, or between
#                            # [night_light]'s fixed times, night light on or not) | hours
# dark_from = "19:00"        # local times for mode = "hours"; a dark_to at or before
# dark_to = "07:00"          # dark_from is the next morning
# material = "frosted"       # frosted | smoked (darker, white titles) | molten (bent edges)
# frame = "rounded"          # rounded | square (flat, separate caption buttons)
# notification_style = "lozenge"  # lozenge | halo (the app icon breaks out of the top-left edge) | droplet (one row, opens on hover)
# orb_glow = 100             # 0 to 100: how strongly the Start button's icon glows; 0: none

# [taskbar]                  # a key left out follows the interface: Glass's
#                            # defaults are shown; Classic and Blue use
#                            # buttons = "when_full" and false for pinned,
#                            # show_desktop_button and peek
# position = "bottom"        # bottom | top | left | right: the output edge
#                            # every bar sits on, under every interface
# side_width = 0             # a left or right bar's width; 0: the
#                            # interface's own (Start's width, or one icon
#                            # in Glass), one icon to a third of the output
#                            # dragging an unlocked side bar's edge sets it
# buttons = "combine"        # combine: one icon-only button per app;
#                            # when_full: one labelled button per window, an
#                            # app's windows grouped once the row is full;
#                            # never: one labelled button per window, always;
#                            # group: as never, an app's buttons side by side
# pinned = true              # the Quick Launch programs share the task row;
#                            # a right click opens a button's jump list,
#                            # a left click on a group its last active window
# small_icons = false        # a 30 px Glass bar with 44 px task buttons
# show_desktop_button = true # a Show desktop strip at the bar's right end
# peek = true                # hovering the strip or a window picture shows
#                            # the desktop or that window alone
# tray_overflow = true       # Passive tray items wait behind an arrow (a ^
#                            # flyout in Glass); Customize... sets single items apart
# badges = true              # a program's unread count (LauncherEntry count)
#                            # shows in a badge on its task buttons, 99+ above 99
# network_meter = false      # download and upload speed on two lines between
#                            # the tray icons and the clock, once a second
# calendar_events = true     # the clock's calendar lists the picked day's
#                            # events (today's at first) from
#                            # evolution-data-server; a click on one opens
#                            # the default calendar program
# auto_hide = false          # the bar slides off its edge when unused, leaving
#                            # a 2 px line; windows take the rest of the screen
# reveal_on_edge = true      # it comes back when the pointer rests on that
#                            # line, clicks it or drags onto it
# reveal_on_keys = true      # ... for the Start key, Ctrl+Esc and Alt+Tab
# reveal_on_attention = true # ... while a window asks for attention, and for
#                            # a new balloon
# attention_flash = 30       # seconds a window's button flashes when it asks
#                            # for attention, then it stays lit until the
#                            # window is focused; 0: lit at once, no flashing

[keyboard]                   # xkb rules/model/layout/variant/options
# rules = ""                 # empty means the system default
# model = ""                 # empty means the system default
# layout = ""                # empty means the system default; "us,hu" gives
#                            # two layouts (four at most), a tray indicator and
#                            # the next-layout chord between them
# variant = ""               # empty means no variant once layout is set; per
#                            # layout, comma separated (",qwerty" with "us,hu")
# options = ""               # empty uses the xkb/XKB_DEFAULT_OPTIONS default
# repeat_rate = 25           # keys per second
# repeat_delay = 600         # milliseconds before repeat starts
# layout_per_window = false  # true: each window keeps the layout it last had;
#                            # a new window starts on the first

# [shortcut_overlay]         # hold Super alone: a sheet of every shortcut in force
# enabled = true
# delay_ms = 1000            # 200 to 5000: how long Super is held first; a quicker
#                            # release is a tap and opens Start

[mouse]                      # every libinput pointer that cannot tap
# speed = 0.0                # -1.0 (slowest) to 1.0 (fastest)
# acceleration = true        # false is libinput's flat profile: raw motion
# natural_scroll = false     # true reverses the wheel: content follows it
# scroll_speed = 1.0         # 0.1 to 10: what each scroll is multiplied by
# middle_emulation = false   # left and right pressed together are a middle click

[touchpad]                   # every libinput pointer that can tap
# speed = 0.0
# acceleration = true
# natural_scroll = false     # true reverses scrolling and the [gestures] desktop swipe:
#                            # content and desktops follow the fingers
# tap_to_click = true        # a one-finger tap clicks, a double tap double-clicks
# two_finger_scroll = true   # both axes; false scrolls along the pad's edges
# two_finger_tap_right_click = true  # false: two fingers middle, three right
# disable_while_typing = true  # ignore the pad (and a clickpad's click) right after a key
# scroll_speed = 1.0         # 0.1 to 10, apart from the mouse's
# middle_emulation = false   # on a pad with buttons: left and right together are middle
# click_method = "default"   # what pressing a clickpad clicks: "areas" (the bottom strip
#                            # is left, middle and right), "clickfinger" (one, two or three
#                            # fingers click left, right or middle), "default" (the pad's own)
# enabled = true             # false turns the pad off; the touchpad key flips this
# disable_with_mouse = false # the pad is off while a mouse is plugged in

# [gestures]                 # touchpad swipes Reprise keeps; other finger counts, pinches
#                            # and holds go to the program under the pointer
# enabled = true
# fingers = 3                # 3 or 4: right goes to the next desktop and left to the one
#                            # before (the other way round with [touchpad] natural_scroll),
#                            # up fades the window overview in, down fades it out
# distance = 400             # 100 to 2000: the travel for a whole desktop or the whole fade, in
#                            # libinput's swipe units (about 3 to 4 cm of finger travel)
# commit_at = 30             # 5 to 95: percent of the way past which a lifted swipe goes through
# flick_speed = 300          # 50 to 5000: swipe units a second over the last 100 ms that make
#                            # a lift a flick, which goes through from any distance; a flick
#                            # back springs back

[touchscreen]                # a finger on an app that takes touch is touch; anywhere else it clicks and drags
# output = "eDP-1"           # the output it covers; default: what udev says, else the laptop's own panel

# [[tablets]]                # a drawing tablet: the first entry whose name matches a tablet maps it
# name = "Wacom Intuos*"     # a glob over the device name (* and ?); left out, every tablet
# output = "DP-2"            # the output it covers; default: the only output, else the whole layout
# keep_aspect = true         # keep the tablet's shape, leaving bands of the output out; default false

# [[tablet_pads]]            # a drawing tablet's pad: the first entry whose name matches a pad maps it
# name = "Wacom Intuos* Pad" # glob over the device name (* and ?); left out, every pad
# buttons = { 1 = "zoom-in", 2 = "ctrl+z", 3 = "mode" }  # 1 is the first button
# ring_up = "ctrl+plus"      # each 15 degrees clockwise; ring_down counter-clockwise
# ring_down = "ctrl+minus"
# strip_up = "volume-up"     # each tenth of the strip towards its top; strip_down away from it
# dial_up = "desktop-prev"   # each detent of a dial, as a wheel scrolling up; dial_down as one scrolling down
# keys = { controlpanel = "run" }  # the pad keys some pads have: buttonconfig, controlpanel, onscreen_keyboard
#                            # a value is a [[keybinds]] action name, "mode" (the next mode),
#                            # "spawn:" and a command ("spawn:krita"), "none", or keys as
#                            # [[keybinds]] spell them, sent to the app in front;
#                            # a button's keys stay down while it does
# ring_step = 15             # degrees of ring per step, above 0 to 360
# strip_step = 0.1           # strip per step, of its length, above 0 to 1
# [[tablet_pads.modes]]      # optional, one per mode, the first mode first: what that mode binds
# ring_up = "volume-up"      # over the entry's own keys. Pads with mode buttons and LEDs count
#                            # their own modes; others move on with a button bound to "mode"

[power]                      # what the Turn Off dialog's buttons run
standby = "systemctl suspend"    # exactly "systemctl|loginctl <verb>" calls logind itself;
poweroff = "systemctl poweroff"  # another command is judged by its exit status;
reboot = "systemctl reboot"      # a refusal or failure shows a message saying why
hibernate = "systemctl hibernate"  # Shift turns Stand By into Hibernate; an empty standby greys it
# The lock's power menu runs these too; one that asks for a password there finds nobody to answer.
# The lid and the buttons (reprise-power's Power Options edits these):
# nothing | screen_off | lock | standby | hibernate | turnoff | ask (the Turn Off dialog)
lid_close = "standby"
power_button = "ask"
sleep_button = "standby"
lock_on_sleep = true         # lock before the machine sleeps, whoever asked (logind's PrepareForSleep); Settings' Screen Saver & Lock page sets it
# locker = "swaylock"        # an ext-session-lock-v1 locker to draw the lock screen; the built-in screen is the fallback
battery_low = 10             # percent; reprise-power shows a balloon
low_battery_saver = true     # from battery_low until plugged in, hold power-profiles-daemon's power saver profile; picking a profile meanwhile wins
battery_critical = 3         # percent; a balloon, then critical_action
critical_action = "hibernate"   # nothing | standby | hibernate | turnoff; a sleep logind cannot do shuts down
always_show_icon = false     # reprise-power's tray icon on a machine without a battery too

[idle]                       # seconds of no input; 0 disables the step
blank_after = 0              # start the [screensaver] over every output until input; a fullscreen window holds it off
lock_after = 600             # lock the screen
lock_fade = 0                # dim the desktop to grey over this many seconds before the lock
screen_off_after = 900       # power every output off; any input turns them back on
suspend_after = 0            # run [power] standby

# [lock]                     # Reprise Settings' Screen Saver & Lock page edits these
# away_device = "AA:BB:CC:DD:EE:FF"  # a paired Bluetooth device, by address or BlueZ object path; empty is off.
#                            # Seen connected, then disconnected away_after_s seconds, it locks the
#                            # session; it never unlocks. It must stay connected while near (docs/configuration.md)
# away_after_s = 30          # 0 locks at once

# [screensaver]              # what [idle] blank_after starts; Reprise Settings' Screen Saver & Lock page edits it
# name = "blank"             # blank | starfield | mystify | logo | photos
# speed = 5                  # 1 to 10: how fast starfield, mystify and logo move
# stars = 200                # starfield: 10 to 1000 stars
# shapes = 2                 # mystify: 1 to 4 shapes
# cycle_colors = true        # mystify and logo change colour as they go
# folder = "~/Pictures"      # photos: the folder shown; unset is the Pictures folder
# photo_seconds = 10         # photos: 3 to 600 seconds per picture

# [idle.battery]             # the same keys while on battery (UPower says so);
# screen_off_after = 300     # a missing key keeps the [idle] value
# suspend_after = 1200

# [display]
# auto_rotate = true         # the built-in screen (eDP, LVDS, DSI) turns with the machine while iio-sensor-proxy reports an accelerometer; false is the rotation lock, which the XF86RotationLockToggle key and Rotate automatically on the Display page also set
# gpu = "/dev/dri/card1"     # read when Reprise starts: the GPU that draws and whose connectors light up; the seat's primary GPU when left out. On a laptop whose HDMI port hangs off the discrete GPU, name that one: the screens on the other GPU then stay dark. A /dev/dri/by-path/ link keeps its name across boots, a cardN may not
# all_gpus = false           # read when Reprise starts: true also opens the other GPUs and tracks their monitors. Only the GPU above draws, so monitors on the others stay dark (and go dark at login); an open discrete GPU cannot power down, which costs battery

# [[outputs]]                # per-output settings, matched by connector name; the Display page of Reprise Settings writes mode, transform, scale, position and adaptive_sync here after you keep the change
#                            # each change is also saved as the layout of the monitors connected then, which wins over these when that set connects again (docs/features.md, Displays)
# name = "DP-1"
# position = [1920, 0]       # top-left in the layout, in logical pixels; outputs without one line up right of the rightmost placed one, and one turned off and on comes back where it was placed unless another output now covers that spot
# primary = true             # the desktop icons, notification balloons and the media keys' panel go here; the first output when none is marked
# scale = 1.5                # 1 to 4 in steps of 0.25; drawn at the next whole scale, then scaled down
# mode = "2560x1440@59.95"   # WIDTHxHEIGHT[@HZ]; the preferred mode when left out or not offered
# transform = "90"           # normal, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270
# adaptive_sync = true       # overrides the top-level adaptive_sync for this output
# icc_profile = "~/.local/share/icc/studio.icc"  # an ICC profile whose calibration curves (vcgt) go into this output's gamma table, night light on top; the Display page's Color profile list sets it

# [screenshot]               # every screenshot goes to the clipboard
# save = true                # and to Pictures/Screenshots (or ~/Screenshots) as a PNG
# record_sound = false       # screen recordings (Videos/Screencasts) also carry what plays

# [previews]                 # live pictures of windows, redrawn while they change
# taskbar = true             # pointing at a task button shows its windows; false keeps the text tip
# fps = 10                   # how often a changing picture is redrawn, 1 to 60; more costs more GPU

# [osd]                      # the on-screen panel the media keys show; Settings > Keyboard also sets these
# caps_lock = true           # Caps Lock On / Off when it changes
# num_lock = true            # Num Lock On / Off when it changes

# [switcher]                 # Alt+Tab; a key left out follows the interface:
#                            # Glass's defaults are shown; Classic and Blue use
#                            # style = "icons", desktop = false, peek = false,
#                            # flip = false
# style = "thumbnails"       # icons: a grid of icons; thumbnails: a live
#                            # picture of every window, its icon bottom-right
# size = "small"             # thumbnails only: "medium" draws the pictures 1.5
#                            # times as large, "large" twice, "huge" three times
# preview = true             # icons only: the selected window live above them
# desktop = true             # the desktop is the last entry; picking it shows it
# peek = true                # resting on an entry shows that window alone
# flip = true                # Super+Tab tilts the windows into a 3D stack; false opens the panel

# [overview]                 # every window of this desktop side by side (Super+W)
# hot_corner = "none"        # or "top-left", "top-right", "bottom-left", "bottom-right":
#                            # pushing the pointer into that screen corner opens it

# [clipboard]                # the last 25 things copied, in memory only, for Super+V
# history = true             # false records nothing and turns the Super+V popup off;
#                            # a copy then leaves the clipboard when its program quits
# terminal_apps = ["reprise.terminal", "foot", "kitty", "Alacritty", "org.wezfurlong.wezterm", "com.mitchellh.ghostty", "org.gnome.Console", "konsole", "xterm"]
#                            # app ids a pick pastes into with Ctrl+Shift+V instead of Ctrl+V
# trusted_apps = []          # Flatpak app ids given the clipboard managers' protocols, for a
#                            # clipboard manager or sync tool; they read everything you copy
#                            # and replace it, even in the background. Settings > Privacy > Clipboard Access
#                            # ticks them. See docs/flatpak-clipboard.md

# [notifications]
# sound = true               # a balloon plays the sound its program asks for, else the
#                            # theme's message-new-instant; low urgency, a suppress-sound
#                            # hint and Do Not Disturb keep it silent
# quiet_hours = []           # ["22:00", "07:00"] holds balloons back from 22:00 until 07:00,
#                            # then they show; critical ones always show
# auto_dnd = true            # balloons also wait while a full-screen window has focus and
#                            # while the screen is shared; false shows them then
# no_balloons = []           # programs whose balloons go to the history only, e.g.
#                            # ["discord"]; critical ones still show. A program is its
#                            # desktop entry id (org.mozilla.Thunderbird), else the name
#                            # it sends (notify-send -a); a Flatpak or snap app is always
#                            # its own app id. Settings > Notifications and a right
#                            # click on its group in the history also set these
# no_sounds = []             # programs whose balloons show without a sound

# [sounds]                   # Settings > Sound also sets these
# theme = "freedesktop"      # an XDG sound theme under /usr/share/sounds or
#                            # ~/.local/share/sounds, for balloons and the bell; a name
#                            # it lacks comes from freedesktop
# bell = true                # a program's system bell plays the theme's bell; false keeps
#                            # it silent, and an unfocused window's task button still flashes
# allow_boost = false        # true lets the volume sliders, the tray wheel and the volume
#                            # keys go past 100 % up to 150 %; turned off, louder outputs
#                            # and programs come back to 100 %

# [privacy]
# recent_files = true        # false hides the recently used files GTK and KDE apps record
#                            # (recently-used.xbel) from the Start menu's Documents, the
#                            # jump lists and the file dialogs' My Recent Documents, and
#                            # records none of the files Reprise and Explorer open
# location = true            # false refuses every program that asks geoclue for the
#                            # location, without the prompt
# capture_border = true      # a red border on the screen around each output, window
#                            # or area being recorded or shared; never in the capture

# [time_zone]
# automatic = false          # true sets the time zone from the location (geoclue) at
#                            # most hourly: at login, on resume and on a new network.
#                            # Needs [privacy] location and polkit allowing
#                            # org.freedesktop.timedate1.set-timezone without a password

# [drives]                   # Settings > Default Programs also sets this
# on_insert = "ask"          # what a plugged-in drive does: "ask" shows a balloon with
#                            # Mount and Open and Mount buttons; "mount" mounts it;
#                            # "open" mounts it and opens a window; "nothing" leaves it
#                            # in Computer. Read as each drive arrives

# [storage]                  # Settings > Advanced also sets this
# low_space_percent = 5      # 0 to 50: a balloon warns once when the disk of your home
#                            # or / has less free than this share of it or than 1 GiB
#                            # (a tenth of a disk under 10 GiB), again after it climbs
#                            # a point past that and falls back; 0 turns it off. Read
#                            # every two minutes

# [bluetooth]                # Bluetooth Devices > Options also sets these
# battery_warning = 15       # 0 to 50: a balloon warns once when a connected device's
#                            # battery drops to this percent, again after it charges
#                            # past this plus 5; 0 turns it off. Read with each reading
# receive_files = true       # a paired device may send files: each one asks Accept or
#                            # Decline and goes to Downloads. Needs obexd (bluez-obex).
#                            # Read at start and when Options is applied

# [remote_desktop]           # the Remote Desktop server; Settings > Remote Desktop
#                            # also sets these and turns it on
# port = 3389                # the TCP port it listens on, on every interface; a change
#                            # moves it at once and ends every connected session. Unused
#                            # under reprise-login, whose /etc/reprise/login.toml sets it
# quality = "balanced"       # "speed", "balanced" or "sharp": sharper text costs bandwidth;
#                            # "balanced" and "sharp" send full colour to a client that takes it
# frame_rate = 60            # 30, 60, 120 or 144 frames a second at most, and never more
#                            # than the screen's refresh rate
# encoder = "auto"           # "auto", "vaapi", "nvenc", "vulkan", "software" (x264) or "none"
#                            # (RemoteFX bitmaps); one that doesn't work here falls back to "auto"
# sound = true               # true plays this computer's sound on every connected one, not
#                            # here; false plays nothing there
# max_viewers = 4            # how many computers may be connected at once, 1 to 16
# lock_on_leave = true       # false leaves the session unlocked when the last computer leaves
# lock_grace_s = 5           # 0 to 60: when the last one left because its screen went (a KVM
#                            # switch), seconds to wait for it to reconnect before locking
# capture_border = false     # true draws [privacy] capture_border's red border around the
#                            # screen while a computer is connected too
# laptop_screen = "lock"     # "lock": while a computer is connected, this screen shows the
#                            # lock and the viewer gets screens sized to its window; "show"
#                            # keeps the session on this screen too, as does a [power] locker
# second_client = "join"     # "join": a computer logging in joins those connected;
#                            # "replace": it ends them, even with max_viewers connected
# avc444_split_encoders = true  # false codes both full-colour views on one encoder, which
#                            # costs 1.2 to 6 times the bytes; only two encoders send the
#                            # AVC444v2 layout

# [debug]                    # Settings > Advanced also sets these
# overlay = false            # true shows frame rate, render times, damage, clients
#                            # and memory in each screen's top-right corner
# overlay_in_captures = false  # true shows it in screenshots and screen sharing too

# [recycle_bin]              # what Delete does, in the desktop and Explorer alike;
#                            # Recycle Bin Properties writes this table
# confirm = true             # false deletes without asking (an erase on a drive with no
#                            # Recycle Bin, and Empty Recycle Bin, still ask)
# independent = false        # true: each drive follows its [recycle_bin.drives] entry
# remove_immediately = false # true erases instead of moving files to the Recycle Bin
# max_percent = 10           # 0 to 100: how much of its drive a Recycle Bin may fill; past it
#                            # the oldest items go first, and an item bigger than the
#                            # whole of it asks to be deleted for good
# older_than_days = 0        # 1 to 3650: items deleted longer ago than this are erased from
#                            # every drive's Recycle Bin, at login and daily; 0 keeps them
# [recycle_bin.drives.home]  # the drive the home folder's Recycle Bin is on; another
# max_percent = 5            # drive by its file system UUID, else its mount point

# [thumbnail_cache]          # thumbnails in Explorer and every file dialog, kept in
#                            # ~/.cache/thumbnails and shared with other file managers
# enabled = true             # false decodes each picture every time it is shown and keeps nothing
# max_mb = 512               # 1 to 4096: the cap; past it the least recently used thumbnails go,
#                            # whichever program wrote them. Read as a window or dialog opens
# external_thumbnailers = true
#                            # PDFs, videos, fonts and other types get thumbnails from the
#                            # installed freedesktop thumbnailers, each run in a bubblewrap
#                            # jail (none run without bubblewrap); false: pictures only

# [launcher]                 # the Super+Space launcher
# search_files = true        # false finds programs only; true also lists files and folders
#                            # in the home folder from two typed characters on
# contents = false           # true also lists files by their text and metadata, with
#                            # search_files on and localsearch installed; the first search
#                            # starts localsearch, which then indexes in the background.
#                            # false never asks or starts it
# windows = true             # also lists open windows by title or program name; Enter
#                            # brings one up. Above the programs when it matches as well
# providers = []             # programs' search providers by desktop id, in the order their
#                            # sections show; those not listed follow by name. One whose
#                            # provider file says DefaultDisabled is asked only once listed
# providers_off = []         # desktop ids of providers never asked, e.g.
#                            # ["org.gnome.Nautilus.desktop"]

# [night_light]              # warm the screen by night; a client that sets the gamma takes precedence
# enabled = false
# temperature = 4000         # kelvin at night, 1000 to 6500 (6500 is no change)
# schedule = "sun"           # "sun": sunset to sunrise; "fixed": from and to
# from = "21:00"             # local times for "fixed"; each edge fades over 30 minutes
# to = "07:00"
# latitude = 47.5            # where sunset is worked out for, both or neither;
# longitude = 19.08          # unset uses the time zone's city (tzdata's zone1970.tab)

# [workspaces]               # virtual desktops, shared by every screen; the taskbar's pager switches
# count = 4                  # 1 to 16; 1 turns them off
# animation = "none"         # how a switch moves the screen: "none" (it just happens), "slide"
#                            # (sideways, a later desktop comes in from the right), "slide-vertical"
#                            # (a later one comes up from below), "fade", "zoom" (the old desktop
#                            # shrinks as it fades) or "wipe" (an edge sweeps the old one away);
#                            # a three-finger swipe slides after the fingers whatever is set here
# animation_ms = 200         # 0 to 2000; 0 is no animation, and a lifted swipe lands at once;
#                            # [effects] reduce_motion = true overrides both with no animation
# wheel_on_desktop = false   # true: the wheel over the desktop steps desktops as over the pager
# names = ["Work", "Chat"]   # each desktop's name, first for desktop 1, in the pager's tip and the
#                            # Move to desktop menus; "" or a missing one is "Desktop N"
# pager = "light"           # how the Glass taskbar marks the current desktop: "light" (a light
#                            # under its number) or "tile" (a glass tile behind it); other
#                            # interfaces ignore it

# [effects]                  # motion, for every interface; a key left out
#                            # follows the interface: Glass's defaults are
#                            # shown, Classic and Blue use false for the switches
# window_animation = true    # windows fade and grow as they open, shrink as they close
# window_open_ms = 250       # 0 to 2000; 0 is no animation
# window_close_ms = 200      # 0 to 2000; 0 is no animation
# window_scale = 0.95        # 0.8 to 1.0: the size an opening window starts at
# hover_fade = true          # caption buttons and Start fade their highlight
# hover_in_ms = 120          # 0 to 2000; 0 lights at once
# hover_out_ms = 250         # 0 to 2000; 0 goes dark at once
# taskbar_slide = true       # task buttons slide aside as a drag reorders them, and the
#                            # dropped one glides into its slot
# taskbar_hide_ms = 200      # 0 to 2000: an auto-hidden taskbar's slide; 0 hides
#                            # and shows it at once
# menu_animation = "fade"    # how menus and the Start menu open, the same under every
#                            # interface: "fade", "slide" (it unrolls from the side
#                            # facing what opened it) or "none"; over [metrics]
#                            # menu_fade_ms
# session_fade = true       # the screen fades in from black at log on and out to
#                            # black at Log Off, Turn Off and Restart; on under
#                            # every interface
# session_fade_in_ms = 600   # 0 to 2000; 0 shows the desktop at once
# session_fade_out_ms = 400  # 0 to 2000; 0 ends at once
# logon_animation = true     # the lock screen's transitions, its fade at unlock and Glass's
#                            # busy ring turning; [login] animation in login.toml does the
#                            # same for the login screen
# reduce_motion = false      # true: the desktop's motion off or at once, over the keys above
#                            # and [workspaces] animation; GTK programs are told through the
#                            # settings portal to stop animating too

# [accessibility]            # keyboard and pointer aids, for every program and the desktop's own keys
# sticky_keys = false        # a tap of Shift, Ctrl, Alt or Super holds it for the next key
# sticky_lock = true         # a second tap locks the modifier, a third lets it go
# sticky_two_keys_off = true # a key pressed while a modifier is held turns StickyKeys off
# slow_keys = false          # a key counts only once it has been held down for the delay
# slow_keys_delay = 1.0      # seconds, 0.3 to 2.0
# bounce_keys = false        # a key pressed again within the delay after it was let go is
#                            # ignored, until another key is pressed
# bounce_keys_delay = 0.5    # seconds, 0.1 to 2.0
# shortcuts = true           # Shift five times toggles StickyKeys, right Shift held 8 s SlowKeys,
#                            # left Alt+left Shift+Num Lock MouseKeys
# mouse_keys = false         # the numeric keypad moves the pointer: 1-9 move, 5 clicks,
#                            # + double-clicks, / * - pick left, middle, right, 0 holds, . lets go;
#                            # Ctrl glides at twice the top speed, Shift at 20 pixels a second
# mouse_keys_speed = 400     # top speed in pixels a second, 50 to 2000
# mouse_keys_acceleration = 1.0  # seconds a held key takes to reach it, 0 to 5
# mouse_keys_num_lock = true # only while Num Lock is on; false: always
# text_size = 100            # percent, 100 to 200 in steps of 25: the taskbar, Start menu, menus,
#                            # captions, tooltips and notifications, the heights that hold them (and
#                            # the caption buttons), dialogs, settings
#                            # pages and program forms (they grow with the text; check boxes,
#                            # bevels and most icons keep their size; the file dialog's places,
#                            # toolbar and Look in icons, List and Details icons in Explorer and
#                            # the file dialog, and User Accounts' pictures grow), the file
#                            # dialog, Open With, Log Off and Turn Off, the windows of
#                            # Explorer, Notepad, Network
#                            # Connections, Printers, Volume Control, Software Updates, User
#                            # Accounts, Bluetooth Devices and Safely Remove Hardware, Notepad's
#                            # text, and GTK's and Qt's text (text-scaling-factor, the qt6ct font).
#                            # The desktop's labels grow and its grid with them; icons keep
#                            # 32 px, and one placed by hand keeps its place on the wider grid.
#                            # Other programs' lists and bars keep their size.
#                            # When it changes, an open window at its program's own size
#                            # takes the program's size at the new text size, larger or
#                            # smaller; one the user resized keeps its size, no smaller than
#                            # its new minimum. A sheet larger than the screen scrolls its page.
# color_filter = "none"      # the whole screen through a filter: "grayscale", "invert", or a
#                            # correction for "deuteranopia", "protanopia" or "tritanopia";
#                            # screenshots and screen sharing stay unfiltered
# color_filter_intensity = 100  # percent, how strongly a correction applies
# magnifier_follow = "pointer+focus"  # "pointer": a zoomed view follows the pointer alone;
#                            # "pointer+focus": also the text cursor and keyboard focus
# locate_pointer = false     # a tap of Ctrl on its own rings the pointer
# visual_bell = "none"       # a program's bell flashes "window" (the window that rang; the
#                            # screen when it can't be seen) or "screen"; [sounds] bell
#                            # says whether it sounds too

# [windows]
# remember = true            # an app's next window opens where its last one closed (size, place,
#                            # screen, maximized); its further windows cascade from it. Each set
#                            # of connected screens keeps its own places, in
#                            # $XDG_STATE_HOME/reprise/windows.toml; a place whose title bar is
#                            # off every screen opens at the default place. The size kept is the
#                            # window's inside, frame left out, so it holds under every interface.
#                            # A size kept at another text_size scales by the ratio of the two, no
#                            # further than the size the program opens at. Settings' Forget
#                            # Positions drops them all
# tabs = true                # a window dragged onto another's title bar joins its tab group;
#                            # false: no tab groups, and turning it off splits the open ones
# shake = "auto"             # shaking a window by its title bar minimizes the other windows on its
#                            # screen and desktop; shaking it again brings them back. "auto" is on
#                            # under Glass and off under Classic and Blue; true or false sets it
# title_double_click = "maximize"  # a double click on a title bar: "maximize" (or restore),
#                            # "shade" rolls the window up to its title bar and back,
#                            # "minimize", or "none"
# dim_inactive = 0           # every window but the focused one (and its dialogs or parent) draws
#                            # this many percent darker, 0 to 40; 0 is off. Its client area only,
#                            # not the frame; full-screen windows, previews and window screenshots
#                            # stay undimmed. Fades in 150 ms with window_animation
# hidden_frame_rate = 0      # 0 to 240: a program that waits on the screen for each frame
#                            # (a Vulkan or EGL game with vsync) runs at most this many frames
#                            # a second while no screen shows its window: covered, minimized
#                            # or on another desktop. 0 keeps the refresh rate; 30 saves its
#                            # CPU and GPU. Window Behavior page of Reprise Settings

# [session]
# restore = true             # the apps open at Log Off, Turn Off or Restart (or a crash) start
#                            # again at the next login, each on its old desktop, and their tab
#                            # groups come back in their own frames with the same tab shown; only
#                            # apps with a Start menu entry; false: nothing starts again
# exclude = ["foot"]         # app ids never started again. Globs: * and ?. X11: the class.
# end_processes = true       # Log Off ends every program Reprise started and, after a display
#                            # manager login, every one left in the login session, windowless
#                            # ones too; false leaves them running

# [updates]
# restart_notice = true      # Software Updates says when the system needs a restart: a kernel
#                            # update removed the running kernel's modules, or a package left
#                            # /run/reboot-required. A balloon once a boot, the tray icon and the
#                            # window until the restart; false shows none of them (Settings > Advanced)

# [[window_rules]]           # every rule that matches applies, in file order; later ones win,
# app_id = "foot"            # and a rule beats the remembered place. Globs: * and ?. X11: the class.
# title = "*build*"          # optional; matched once, when the window opens
# size = [800, 600]          # outer size, frame included
# position = [40, 40]        # frame's top-left from the screen's top-left, kept inside the work area
# output = "DP-1"            # the screen by connector name or monitor id ("make|model|serial");
#                            # the one under the pointer when absent
# state = "maximized"        # normal, maximized, minimized or fullscreen
# desktop = 2                # 1 to [workspaces] count
# always_on_top = true
# sticky = true              # on every desktop
# tab_group = "shells"       # windows matching rules with the same name share one tab group: the
#                            # first one opens on its own, later ones join it as the last tab; a
#                            # window pulled out of the group is passed over until regrouped
#                            # dialogs keep centring on their owner; fixed-size windows ignore size
# from_menu = true           # written by the window menu's Always Open Here, which ticks, replaces
#                            # and removes it; one per app id, last so it beats hand-written rules

# [window_snapping]          # snap a window to the screen's edges and the zones of its layout
# enabled = true             # drag snapping; the Super+arrow binds always work
# picker = true              # resting on a maximize button shows the snap layouts; Super+z always does
# bar = true                 # with enabled, dragging a title bar toward the top shows the snap layouts in a bar there
# distance = 30              # px from a screen edge where a drag snaps, 1 to 100; corners reach twice as far
# layouts = ["1|1", "2|1", "1|1:2"]  # the flyout's and the bar's layouts, up to 6; unset gives six built-in ones.
#                            # Columns' weights joined by |, or rows' by -; weight:n cuts that one
#                            # into n: "2|1" is two thirds and a third, "1-1:2" a top half over two
#                            # quarters. After a layout is picked, holding Shift while dragging
#                            # shows its zones. After a snap, the other zones offer the desktop's
#                            # other windows to fill them.

# The [[keybinds]] below are the defaults. A list in your file layers over
# them: an entry on a default's keys (compared by key and modifiers, so
# "super+Q" is Super+q) replaces that bind, and every other default stays.
# action = "none" leaves its keys unbound, a default's included. Binding an
# action to other keys keeps its default keys too; a "none" frees them.
# While a dialog (Run, Turn Off, ...) has the keyboard, only the zoom, color
# filter, lock, screenshot, layout, do-not-disturb, night light, media,
# brightness and Wi-Fi binds and chords run, with Alt+Tab and Super+Tab
# outside a Welcome panel and Show Desktop over a windowed dialog; every other
# press goes to the dialog.
#[[keybinds]]
#keys = "Super+q"
#action = "none"

[[keybinds]]
keys = "Super+Return"
action = "terminal"

[[keybinds]]
keys = "Super+q"
action = "close"

[[keybinds]]
keys = "Alt+F4"
action = "close"             # on the desktop, with no window focused, opens Turn Off

[[keybinds]]
keys = "Alt+Tab"
action = "cycle"

[[keybinds]]                 # Alt+Tab over the focused app's windows alone; Shift goes back.
keys = "Alt+grave"           # "grave" is the key above Tab on any layout
action = "cycle-app"

[[keybinds]]                 # the 3D switcher under Glass ([switcher] flip), else as Alt+Tab
keys = "Super+Tab"
action = "flip"

[[keybinds]]
keys = "Super+Shift+e"
action = "exit"

[[keybinds]]
keys = "Super+l"
action = "lock"

[[keybinds]]                 # a tap on Super alone does the same
keys = "Ctrl+Escape"
action = "startmenu"

[[keybinds]]
keys = "Super+r"
action = "run"

[[keybinds]]                 # the focused window's menu
keys = "Alt+space"
action = "windowmenu"

[[keybinds]]                 # hide or show the focused window's border and caption
keys = "Super+Shift+b"
action = "toggleframe"

[[keybinds]]                 # the application launcher: type to find, Enter to start
keys = "Super+space"
action = "launcher"

[[keybinds]]                 # the task manager (`task_manager`)
keys = "Ctrl+Shift+Escape"
action = "task-manager"

[[keybinds]]                 # centre the focused window on the screen under the pointer
keys = "Super+c"
action = "center"

# Super and an arrow move the focused window across its screen's snap
# layout: halves until a layout is picked, then the picked one, at the
# splits a shared edge was dragged to. Left and Right step to the next
# zone and on to the next screen; Up steps up or maximizes; Down steps
# down, restores a maximized window, then gives it its size from before
# the snap back.
[[keybinds]]
keys = "Super+Left"
action = "snap-left"

[[keybinds]]
keys = "Super+Right"
action = "snap-right"

[[keybinds]]
keys = "Super+Up"
action = "snap-up"

[[keybinds]]
keys = "Super+Down"
action = "snap-down"

# Super+Ctrl and an arrow show the desktop before or after this one
# ([workspaces]); there is nothing past the first or the last. With Shift
# too, the focused window comes along.
[[keybinds]]
keys = "Super+Ctrl+Left"
action = "desktop-prev"

[[keybinds]]
keys = "Super+Ctrl+Right"
action = "desktop-next"

[[keybinds]]
keys = "Super+Ctrl+Shift+Left"
action = "desktop-carry-prev"

[[keybinds]]
keys = "Super+Ctrl+Shift+Right"
action = "desktop-carry-next"

# Show the focused window on every desktop, or only on this one; the window
# menu's Show on All Desktops row does the same. Not bound by default.
#[[keybinds]]
#keys = "Super+Ctrl+a"
#action = "all-desktops"

# Keep the focused window above the others, or stop; the window menu's
# Always on Top row does the same. Not bound by default.
#[[keybinds]]
#keys = "Super+t"
#action = "alwaysontop"

# Open a mini view of the focused window, or close it; the window menu's
# Mini View row does the same. Not bound by default.
#[[keybinds]]
#keys = "Super+Shift+m"
#action = "mini-view"

# Turn Do Not Disturb on or off: only critical notifications raise a
# balloon, the rest still go into the history behind the tray's bell. The
# history's check box does the same; the bell's right-click menu also turns it
# on for an hour or until tomorrow. Not bound by default.
#[[keybinds]]
#keys = "Super+n"
#action = "do-not-disturb"

[[keybinds]]                 # copy the whole screen to the clipboard as a PNG
keys = "Print"
action = "screenshot"

[[keybinds]]                 # copy the focused window, frame and all; Alt+PrtSc reads as Sys_Req
keys = "Alt+Sys_Req"
action = "screenshot-window"

[[keybinds]]                 # the same, for keyboards without PrtSc
keys = "Super+Shift+w"
action = "screenshot-window"

[[keybinds]]                 # drag out a rectangle, or click a window; Esc cancels
keys = "Shift+Print"
action = "screenshot-region"

[[keybinds]]                 # the focused window's content, without its frame
keys = "Ctrl+Alt+Sys_Req"
action = "screenshot-content"

[[keybinds]]                 # start a recording of the screen under the pointer; again stops it
keys = "Ctrl+Shift+Alt+r"
action = "record-screen"

#[[keybinds]]                # the region picker in Record mode (V switches it in the picker too)
#keys = "Super+Shift+r"
#action = "record-region"

[[keybinds]]                 # pick a colour on screen: a loupe follows the pointer, a click
keys = "Super+Shift+c"       # copies #rrggbb; arrows nudge, Enter picks, Esc or right-click cancels
action = "color-picker"

[[keybinds]]                 # the clipboard history: type to filter, Enter pastes, Del forgets
keys = "Super+v"
action = "clipboard-history"

[[keybinds]]                 # the emoji picker: type to search, arrows move, Enter types it
keys = "Super+period"
action = "emoji-picker"

# The magnifier zooms the screen under the pointer from 1x to 8x in steps
# of 0.5x; the view pans when the pointer pushes against its edge, and
# to the text cursor or keyboard focus when typing moves it
# ([accessibility] magnifier_follow). The cursor keeps its size, and
# screenshots and screen sharing see the screen unzoomed.
[[keybinds]]
keys = "Super+equal"
action = "zoom-in"

[[keybinds]]
keys = "Super+minus"
action = "zoom-out"

[[keybinds]]
keys = "Super+0"
action = "zoom-reset"

[[keybinds]]                 # turn [accessibility] color_filter off, and back on
keys = "Super+Ctrl+c"
action = "color-filter"

[[keybinds]]                 # start the screen reader (Orca), or stop it; a sound and an
keys = "Super+Alt+s"         # on-screen line say which
action = "screen-reader"

[[keybinds]]                 # every window of this desktop side by side: arrows pick, Enter shows,
keys = "Super+w"             # typing searches the launcher; [overview] hot_corner opens it too
action = "overview"

[[keybinds]]                 # the snap layouts under the focused window's maximize button:
keys = "Super+z"             # arrows pick a zone, Enter snaps the window there
action = "snap-layouts"

[[keybinds]]                 # the display switcher: Extend, Duplicate, Only 1, Only 2; each press
keys = "Super+p"             # moves to the next, letting go of Super or Enter picks it
action = "display-switcher"

[[keybinds]]                 # the keyboard to the taskbar, on Start: arrows walk it, Enter
keys = "Super+t"             # clicks, the Menu key or Shift+F10 opens a menu, Esc goes back
action = "focus-taskbar"

[[keybinds]]                 # the same, on the notification area
keys = "Super+b"
action = "focus-tray"

# A bind whose key is itself a modifier (Alt_L, Shift_R, Control_L,
# Super_L, ...) is a modifier-only chord: it fires when one of its keys is
# released and nothing else was pressed in between, in either order. This
# one is the left Alt with either Shift: the next [keyboard] layout. A bind
# with the key and a modifier swapped on the same side ("Alt+Shift_L")
# counts as this chord and replaces it; "Alt+Shift_R" is a chord of its own.
[[keybinds]]
keys = "Shift+Alt_L"
action = "next-layout"

# A window dragged by its title bar and held on another's title bar until a
# ghost tab shows there joins that window's tab group on the release; the
# window menu's "Add to Tabs of" does the same. These show the focused
# group's next tab and the one before (Ctrl+Tab stays the program's own).
[[keybinds]]
keys = "Super+grave"
action = "tab-next"

[[keybinds]]
keys = "Super+Page_Down"
action = "tab-next"

[[keybinds]]
keys = "Super+Page_Up"
action = "tab-prev"

# The media keys (volume, mute, brightness, play/pause, ...) act on their
# own, ahead of the lock screen. A bind on one of them replaces its
# built-in action and makes it an ordinary bind, so it no longer works
# while the screen is locked; the actions
# volume-up, volume-down, mute, mic-mute, brightness-up, brightness-down,
# kbd-brightness-up, kbd-brightness-down, play-pause, next, prev, stop,
# wifi, touchpad (on or off), touchpad-on, touchpad-off, airplane-mode and
# rotation-lock bind to any key.
#[[keybinds]]
#keys = "Super+F10"
#action = "mute"

# What the Quick Launch folder (~/.config/reprise/quicklaunch/, one .desktop
# file per button) is seeded with the first time it is missing; afterwards
# the folder is what counts. Each runs a `command` or `action`; `label` is
# the tooltip. A `command` becomes the file's Exec line, so it runs split
# into arguments the way a .desktop file's is, with no shell.
# `quicklaunch = []` seeds nothing. Leaving the block out gives exactly
# these three.
[[quicklaunch]]
label = "Launch Web Browser"
icon = "web-browser"
command = "xdg-open https://duckduckgo.com/"

[[quicklaunch]]
label = "Show Desktop"
icon = "user-desktop"
action = "showdesktop"       # minimize every window, or bring them back

[[quicklaunch]]
label = "Terminal"
icon = "utilities-terminal"
action = "terminal"

# The Start menu, top to bottom. An entry runs a `command` or `action`, or
# opens a submenu: `submenu = "programs"` (installed applications),
# "settings" (applications in the Settings category), "documents" (the XDG
# user directories that exist, opened in Explorer), or nested
# `[[startmenu.items]]`; an entry with none of these (or `items = []`) is an
# empty folder. `icon` is an icon theme name or absolute path.
# `&` before a letter in a label makes it the access key (underlined when
# navigating by keyboard); `&&` is a literal ampersand. Leaving the whole
# block out gives exactly this menu. reprise-settings' Start Menu tab
# edits this block and writes it back whole, without comments inside it.
[[startmenu]]
label = "&Programs"
icon = "applications-other"
submenu = "programs"

[[startmenu]]
label = "&Documents"
icon = "folder-documents"
submenu = "documents"

[[startmenu]]
label = "&Settings"
icon = "preferences-system"
[[startmenu.items]]
label = "&Control Panel"
icon = "preferences-other"
submenu = "settings"
tip = "Provides options for you to customize the appearance and functionality of your computer, add or remove programs, and set up network connections and user accounts."
[[startmenu.items]]
separator = true
[[startmenu.items]]
label = "&Network Connections"
icon = "network-workgroup"
command = "reprise-network"
tip = "Displays existing network connections on this computer and helps you create new ones"
[[startmenu.items]]
label = "&Printers"
icon = "printer"
command = "reprise-printers"
tip = "Add, remove, and configure local and network printers, and see what is printing."
[[startmenu.items]]
label = "&Taskbar and Start Menu"
icon = "preferences-desktop"
command = "reprise-settings --page taskbar" # Reprise Settings on its Taskbar page; its Advanced page's Edit File... button opens this file
tip = "Customize the Start Menu and the taskbar, such as the types of items to be displayed and how they should appear."

[[startmenu]]
label = "Sear&ch"
icon = "system-search"
[[startmenu.items]]
label = "&For Files or Folders..."
icon = "system-search"
command = 'reprise-explorer "$HOME"'
[[startmenu.items]]
label = "On the &Internet..."
icon = "web-browser"
command = "xdg-open https://duckduckgo.com/"

[[startmenu]]
label = "&Help and Support"
icon = "help-browser"
command = "xdg-open https://github.com/reprise-project/reprise-desktop"

[[startmenu]]
label = "&Run..."
icon = "system-run"
action = "run"               # the Run dialog; also on Super+r

[[startmenu]]
separator = true

[[startmenu]]
label = "&Log Off {user}..."   # {user} is the login name
icon = "gnome-session-logout"
action = "logoff"            # asks first, then exits the compositor

[[startmenu]]
label = "T&urn Off Computer..."
icon = "system-shutdown"
action = "turnoff"           # Stand By / Turn Off / Restart, running the [power] commands
